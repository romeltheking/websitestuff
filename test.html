<!DOCTYPE html>
<html lang="en">
 
<head>
  <meta charset="UTF - 8">
  <meta name="viewport" content="width=device-width, initial - scale=1.0">
  <style>
    .element {
      margin-top: 500px;
      background-color: lightgreen;
      padding: 20px;
    }
  </style>
</head>
 
<body>
  <div class="element">
    This element will appear on scroll using ScrollReveal.
  </div>
  <script src="https://unpkg.com/scrollreveal"></script>
  <script>
    ScrollReveal().reveal('.element', {
      delay: 200,
      duration: 500,
      distance: '20px',
      origin: 'bottom',
      opacity: 0
    });
  </script>
</body>
 
</html>
